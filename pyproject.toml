[project]
name = "quantumcert"
version = "0.1.0"
description = "Post-quantum (SLH-DSA, FIPS 205) signed PDF certificates with QR verification — academic prototype"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]
